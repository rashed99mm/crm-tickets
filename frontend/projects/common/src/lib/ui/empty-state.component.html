<!--
  No panel. A successful-but-empty list is not a thing on the page — it is the page having nothing
  to show — so drawing a bordered box around that statement gives absence a physical presence it
  should not have, and reads as a broken card. Just the glyph and the sentence, breathing.
-->
<div class="relative mx-auto flex max-w-md flex-col items-center gap-3 px-6 py-16 text-center">
  <!-- A soft halo instead of a container: it gives the glyph a centre of gravity without an edge. -->
  <div
    class="pointer-events-none absolute inset-x-0 top-10 mx-auto h-40 w-40 rounded-full bg-primary/[0.04] blur-2xl"
    aria-hidden="true"
  ></div>

  <cs-icon name="inbox" [size]="44" class="relative text-outline-variant" />

  <p class="relative text-headline-md text-on-surface">{{ message() }}</p>

  @if (hint()) {
    <p class="relative max-w-sm text-body-sm leading-6 text-on-surface-variant">{{ hint() }}</p>
  }
</div>
