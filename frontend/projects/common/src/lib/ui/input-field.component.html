<div class="flex flex-col gap-1.5">
  <label [for]="id" class="text-label-md font-semibold text-on-surface-variant">
    {{ label() }}
  </label>

  <input
    [id]="id"
    [type]="type()"
    [formControl]="control()"
    [attr.aria-invalid]="showError() ? 'true' : null"
    [attr.aria-describedby]="showError() ? errorId : null"
    class="h-10 rounded-lg border bg-surface-lowest px-3 text-body-md text-on-surface transition-all outline-none focus:ring-2 focus:ring-primary/20"
    [class]="borderTone()"
  />

  @if (showError()) {
    <p [id]="errorId" role="alert" class="text-body-sm text-error">
      {{ errorText() }}
    </p>
  }
</div>
