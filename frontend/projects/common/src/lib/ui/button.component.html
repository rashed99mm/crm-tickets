<button
  [type]="type()"
  [disabled]="disabled() || busy()"
  [attr.aria-label]="ariaLabel()"
  (click)="pressed.emit()"
  class="inline-flex min-h-10 items-center justify-center gap-2 rounded-xl px-4 py-2 text-label-lg font-semibold transition-all focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-primary disabled:pointer-events-none disabled:translate-y-0 disabled:scale-100 disabled:opacity-50"
  [class]="tone()"
>
  @if (busy()) {
    <span
      class="inline-block size-3.5 animate-spin rounded-full border-2 border-current border-t-transparent"
    ></span>
  }
  <ng-content />
</button>
