<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Realtime Viewer - CommandCenter CMS Integration Gateway</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            color: #333;
        }
        
        .header {
            background: rgba(0,0,0,0.2);
            color: white;
            padding: 1.5rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            backdrop-filter: blur(10px);
        }
        
        .header h1 { font-size: 1.5rem; display: flex; align-items: center; gap: 0.5rem; }
        
        .status-indicator {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #28a745;
            animation: pulse 2s infinite;
        }
        
        .status-indicator.error {
            background: #dc3545;
            animation: none;
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        
        .header a { color: white; text-decoration: none; opacity: 0.8; }
        .header a:hover { opacity: 1; }
        
        .stats-bar {
            background: rgba(255,255,255,0.1);
            color: white;
            padding: 0.8rem 2rem;
            display: flex;
            gap: 2rem;
            font-size: 0.9rem;
            backdrop-filter: blur(10px);
            flex-wrap: wrap;
        }
        
        .stat { display: flex; align-items: center; gap: 0.5rem; }
        .stat-value { font-weight: bold; font-size: 1.1rem; }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 2rem;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 2rem;
        }
        
        @media (max-width: 900px) {
            .container { grid-template-columns: 1fr; }
        }
        
        .column {
            background: white;
            border-radius: 16px;
            padding: 1.5rem;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            max-height: calc(100vh - 200px);
            overflow-y: auto;
        }
        
        .column-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
            padding-bottom: 1rem;
            border-bottom: 2px solid #f0f0f0;
        }
        
        .column-header h2 {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 1.2rem;
        }
        
        .icon { font-size: 1.5rem; }
        
        .badge {
            background: #667eea;
            color: white;
            padding: 0.2rem 0.8rem;
            border-radius: 12px;
            font-size: 0.8rem;
            font-weight: 600;
        }
        
        .message-card {
            background: #f8f9fa;
            border-radius: 12px;
            padding: 1.2rem;
            margin-bottom: 1rem;
            border-left: 4px solid #667eea;
            animation: slideIn 0.3s ease-out;
            transition: transform 0.2s;
        }
        
        .message-card:hover { transform: translateX(5px); }
        
        .message-card.sms { border-left-color: #28a745; }
        .message-card.email { border-left-color: #007bff; }
        .message-card.failed { border-left-color: #dc3545; background: #fff5f5; }
        
        @keyframes slideIn {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .message-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0.8rem;
        }
        
        .message-type {
            font-weight: 600;
            text-transform: uppercase;
            font-size: 0.75rem;
            letter-spacing: 1px;
            color: #667eea;
        }
        
        .message-time {
            font-size: 0.8rem;
            color: #999;
        }
        
        .message-to {
            font-weight: 600;
            color: #333;
            margin-bottom: 0.5rem;
            word-break: break-all;
        }
        
        .message-body {
            background: white;
            padding: 0.8rem;
            border-radius: 8px;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            font-size: 0.85rem;
            color: #555;
            word-break: break-word;
            margin-bottom: 0.5rem;
            white-space: pre-wrap;
            line-height: 1.6;
        }

        .message-body a {
            color: #667eea;
            text-decoration: underline;
        }

        .message-subject {
            font-weight: 600;
            color: #333;
            margin-bottom: 0.4rem;
            font-size: 0.9rem;
        }
        
        .message-response {
            font-size: 0.8rem;
            padding: 0.5rem;
            border-radius: 6px;
            background: #e9ecef;
        }
        
        .message-response.success { background: #d4edda; color: #155724; }
        .message-response.failed { background: #f8d7da; color: #721c24; }
        
        .otp-highlight {
            background: #fff3cd;
            padding: 0.2rem 0.4rem;
            border-radius: 4px;
            font-weight: bold;
            color: #856404;
        }
        
        .empty-state {
            text-align: center;
            padding: 3rem;
            color: #999;
        }
        
        .empty-state .icon { font-size: 3rem; margin-bottom: 1rem; }
        
        .toast {
            position: fixed;
            bottom: 2rem;
            right: 2rem;
            background: #28a745;
            color: white;
            padding: 1rem 1.5rem;
            border-radius: 8px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.3);
            animation: toastIn 0.3s ease-out;
            z-index: 1000;
        }
        
        @keyframes toastIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>
            <span class="status-indicator" id="statusIndicator"></span>
            Realtime Message Viewer
        </h1>
        <a href="/">Back to Dashboard</a>
    </div>
    
    <div class="stats-bar">
        <div class="stat">
            <span>Total Messages:</span>
            <span class="stat-value" id="totalCount">0</span>
        </div>
        <div class="stat">
            <span>SMS:</span>
            <span class="stat-value" id="smsCount">0</span>
        </div>
        <div class="stat">
            <span>Email:</span>
            <span class="stat-value" id="emailCount">0</span>
        </div>
        <div class="stat">
            <span>Status:</span>
            <span class="stat-value" id="pollStatus">Polling...</span>
        </div>
    </div>
    
    <div class="container">
        <div class="column">
            <div class="column-header">
                <h2><span class="icon">📱</span> SMS Messages</h2>
                <span class="badge" id="smsBadge">0</span>
            </div>
            <div id="smsContainer">
                <div class="empty-state">
                    <div class="icon">📭</div>
                    <p>No SMS messages yet</p>
                    <p style="font-size: 0.85rem; margin-top: 0.5rem;">Send an SMS to see it here</p>
                </div>
            </div>
        </div>
        
        <div class="column">
            <div class="column-header">
                <h2><span class="icon">📧</span> Email Messages</h2>
                <span class="badge" id="emailBadge">0</span>
            </div>
            <div id="emailContainer">
                <div class="empty-state">
                    <div class="icon">📭</div>
                    <p>No emails yet</p>
                    <p style="font-size: 0.85rem; margin-top: 0.5rem;">Send an email to see it here</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        let messages = [];
        let lastMessageCount = 0;
        let pollInterval = null;

        async function fetchMessages() {
            try {
                const res = await fetch('/api/realtime/messages?limit=50');
                const data = await res.json();
                
                if (data.success && data.data.messages) {
                    const apiMessages = data.data.messages;
                    
                    // Check if we have new messages
                    if (apiMessages.length !== lastMessageCount) {
                        const newCount = apiMessages.length - lastMessageCount;
                        if (newCount > 0 && lastMessageCount > 0) {
                            showToast(`${newCount} new message(s) received`);
                        }
                        lastMessageCount = apiMessages.length;
                        messages = apiMessages;
                        updateStats();
                        renderMessages();
                    }
                    
                    document.getElementById('pollStatus').textContent = 'Live';
                    document.getElementById('statusIndicator').classList.remove('error');
                } else {
                    document.getElementById('pollStatus').textContent = 'Error';
                    document.getElementById('statusIndicator').classList.add('error');
                }
            } catch (err) {
                console.log('[Polling] API check failed:', err.message);
                document.getElementById('pollStatus').textContent = 'Offline';
                document.getElementById('statusIndicator').classList.add('error');
            }
        }

        function updateStats() {
            const total = messages.length;
            const sms = messages.filter(m => m.type === 'sms').length;
            const email = messages.filter(m => m.type === 'email').length;
            
            document.getElementById('totalCount').textContent = total;
            document.getElementById('smsCount').textContent = sms;
            document.getElementById('emailCount').textContent = email;
            document.getElementById('smsBadge').textContent = sms;
            document.getElementById('emailBadge').textContent = email;
        }

        function renderMessages() {
            const smsMessages = messages.filter(m => m.type === 'sms');
            const emailMessages = messages.filter(m => m.type === 'email');
            
            document.getElementById('smsContainer').innerHTML = smsMessages.length 
                ? smsMessages.map(m => createMessageCard(m)).join('')
                : createEmptyState('SMS');
                
            document.getElementById('emailContainer').innerHTML = emailMessages.length
                ? emailMessages.map(m => createMessageCard(m)).join('')
                : createEmptyState('Email');
        }

        function createMessageCard(message) {
            const isFailed = message.response && message.response.status === 'failed';
            const statusClass = isFailed ? 'failed' : 'success';
            
            let bodyContent = '';
            let subjectLine = '';
            
            if (message.type === 'sms') {
                bodyContent = message.payload.body || '(No body)';
                bodyContent = escapeHtml(bodyContent);
            } else {
                // Email: show subject as header, then stripped HTML body
                subjectLine = message.payload.subject || '(No subject)';
                if (message.payload.html) {
                    const cleanText = stripHtml(message.payload.html);
                    bodyContent = escapeHtml(cleanText);
                } else if (message.payload.body) {
                    bodyContent = escapeHtml(message.payload.body);
                } else {
                    bodyContent = '(No body)';
                }
            }
            
            // Highlight OTP codes
            bodyContent = highlightOTP(bodyContent);
            
            const time = new Date(message.timestamp).toLocaleTimeString();
            
            return `
                <div class="message-card ${message.type} ${isFailed ? 'failed' : ''}">
                    <div class="message-header">
                        <span class="message-type">${message.type.toUpperCase()}</span>
                        <span class="message-time">${time}</span>
                    </div>
                    <div class="message-to">To: ${escapeHtml(message.payload.to || 'N/A')}</div>
                    ${message.type === 'email' ? `<div class="message-subject">Subject: ${escapeHtml(subjectLine)}</div>` : ''}
                    <div class="message-body">${bodyContent}</div>
                    <div class="message-response ${statusClass}">
                        Status: <strong>${message.response.status || 'unknown'}</strong>
                        ${message.response.messageId ? `<br>ID: ${message.response.messageId}` : ''}
                        ${message.response.error ? `<br>Error: ${message.response.error.code} - ${message.response.error.message}` : ''}
                    </div>
                </div>
            `;
        }

        function createEmptyState(type) {
            return `
                <div class="empty-state">
                    <div class="icon">📭</div>
                    <p>No ${type} messages yet</p>
                    <p style="font-size: 0.85rem; margin-top: 0.5rem;">Send a ${type.toLowerCase()} to see it here</p>
                </div>
            `;
        }

        function highlightOTP(text) {
            return text.replace(/(\b\d{4,6}\b)/g, '<span class="otp-highlight">$1</span>');
        }

        function escapeHtml(text) {
            if (!text) return '';
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function stripHtml(html) {
            if (!html) return '';
            
            // Step 1: Convert <a href="...">text</a> to "text (Link: href)"
            let text = html.replace(/<a\s+[^>]*href=["']([^"']+)["'][^>]*>([^<]*)<\/a>/gi, '$2 (Link: $1)');
            
            // Step 2: Create a temporary div to strip remaining HTML tags
            const tmp = document.createElement('div');
            tmp.innerHTML = text;
            text = tmp.textContent || tmp.innerText || '';
            
            // Step 3: Clean up whitespace - preserve paragraph breaks but collapse extra spaces
            return text.replace(/\n\s*\n/g, '\n').replace(/[ \t]+/g, ' ').trim();
        }

        function showToast(message) {
            const toast = document.createElement('div');
            toast.className = 'toast';
            toast.textContent = message;
            document.body.appendChild(toast);
            setTimeout(() => toast.remove(), 3000);
        }

        // Start polling every 2 seconds
        fetchMessages(); // Initial load
        pollInterval = setInterval(fetchMessages, 2000);

        // Cleanup on page unload
        window.addEventListener('beforeunload', () => {
            if (pollInterval) clearInterval(pollInterval);
        });
    </script>
</body>
</html>
