<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mock Manager - CommandCenter CMS Integration Gateway</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f5f7fa;
            color: #333;
        }
        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 1.5rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .header h1 { font-size: 1.5rem; }
        .header a { color: white; text-decoration: none; opacity: 0.8; }
        .header a:hover { opacity: 1; }
        .container { max-width: 1200px; margin: 2rem auto; padding: 0 2rem; }
        .card {
            background: white;
            border-radius: 8px;
            padding: 1.5rem;
            margin-bottom: 1.5rem;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        .card h2 { margin-bottom: 1rem; color: #667eea; }
        .service-list { display: grid; gap: 0.5rem; }
        .service-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.8rem;
            background: #f8f9fa;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.2s;
        }
        .service-item:hover { background: #e9ecef; }
        .service-item.active { background: #667eea; color: white; }
        .badge {
            background: #667eea;
            color: white;
            padding: 0.2rem 0.6rem;
            border-radius: 12px;
            font-size: 0.8rem;
        }
        .record-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 1rem;
        }
        .record-table th, .record-table td {
            text-align: left;
            padding: 0.8rem;
            border-bottom: 1px solid #e9ecef;
        }
        .record-table th { color: #666; font-weight: 600; }
        .btn {
            background: #667eea;
            color: white;
            border: none;
            padding: 0.6rem 1.2rem;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.9rem;
            margin-right: 0.5rem;
        }
        .btn:hover { background: #5a6fd6; }
        .btn-secondary { background: #6c757d; }
        .btn-danger { background: #dc3545; }
        .btn-small { padding: 0.3rem 0.6rem; font-size: 0.8rem; }
        .form-group { margin-bottom: 1rem; }
        .form-group label { display: block; margin-bottom: 0.3rem; font-weight: 500; }
        .form-group input, .form-group textarea {
            width: 100%;
            padding: 0.6rem;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-family: monospace;
        }
        .json-editor {
            width: 100%;
            min-height: 200px;
            padding: 0.8rem;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-family: monospace;
            font-size: 0.9rem;
        }
        .message {
            padding: 0.8rem;
            border-radius: 4px;
            margin-bottom: 1rem;
        }
        .message.success { background: #d4edda; color: #155724; }
        .message.error { background: #f8d7da; color: #721c24; }
        .hidden { display: none; }
    </style>
</head>
<body>
    <div class="header">
        <h1>CommandCenter CMS - Mock Manager</h1>
        <a href="/">Back to Dashboard</a>
    </div>
    
    <div class="container">
        <div id="message" class="message hidden"></div>
        
        <div class="card">
            <h2>Services</h2>
            <div id="serviceList" class="service-list">
                <p>Loading...</p>
            </div>
        </div>
        
        <div id="recordsCard" class="card hidden">
            <h2>Records - <span id="currentService">None</span></h2>
            <div style="margin-bottom: 1rem;">
                <button class="btn" onclick="showAddForm()">Add Record</button>
                <button class="btn btn-secondary" onclick="reloadMocks()">Reload Mocks</button>
                <button class="btn btn-secondary" onclick="createBackup()">Create Backup</button>
            </div>
            <div id="recordsContainer">
                <p>Select a service to view records</p>
            </div>
        </div>
        
        <div id="editCard" class="card hidden">
            <h2>Edit Record</h2>
            <div class="form-group">
                <label>Record JSON:</label>
                <textarea id="editJson" class="json-editor"></textarea>
            </div>
            <button class="btn" onclick="saveRecord()">Save</button>
            <button class="btn btn-secondary" onclick="hideEdit()">Cancel</button>
        </div>
    </div>
    
    <script>
        let currentServiceName = null;
        let currentRecordIndex = null;
        
        async function loadServices() {
            try {
                const res = await fetch('/api/mock-admin/services');
                const data = await res.json();
                const list = document.getElementById('serviceList');
                
                if (!data.success || !data.data.services.length) {
                    list.innerHTML = '<p>No services found</p>';
                    return;
                }
                
                list.innerHTML = data.data.services.map(s => `
                    <div class="service-item" onclick="selectService('${s.name}')">
                        <span>${s.displayName}</span>
                        <span class="badge">${s.recordCount} records</span>
                    </div>
                `).join('');
                
            } catch (err) {
                showMessage('Error loading services: ' + err.message, 'error');
            }
        }
        
        async function selectService(name) {
            currentServiceName = name;
            document.querySelectorAll('.service-item').forEach(el => el.classList.remove('active'));
            event.currentTarget.classList.add('active');
            
            document.getElementById('recordsCard').classList.remove('hidden');
            document.getElementById('currentService').textContent = name;
            document.getElementById('editCard').classList.add('hidden');
            
            await loadRecords(name);
        }
        
        async function loadRecords(name) {
            try {
                const res = await fetch(`/api/mock-admin/services/${name}`);
                const data = await res.json();
                const container = document.getElementById('recordsContainer');
                
                if (!data.success) {
                    container.innerHTML = '<p>Error loading records</p>';
                    return;
                }
                
                const content = data.data.content;
                let records = [];
                
                if (Array.isArray(content)) {
                    records = content;
                } else if (typeof content === 'object') {
                    for (const key of Object.keys(content)) {
                        if (Array.isArray(content[key])) {
                            records = content[key];
                            break;
                        }
                    }
                }
                
                if (!records.length) {
                    container.innerHTML = '<p>No records found</p>';
                    return;
                }
                
                container.innerHTML = `
                    <table class="record-table">
                        <thead>
                            <tr>
                                <th>#</th>
                                <th>Data</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${records.map((r, i) => `
                                <tr>
                                    <td>${i}</td>
                                    <td><pre style="margin:0;white-space:pre-wrap;">${JSON.stringify(r, null, 2).substring(0, 200)}${JSON.stringify(r).length > 200 ? '...' : ''}</pre></td>
                                    <td>
                                        <button class="btn btn-small" onclick="editRecord(${i}, ${JSON.stringify(JSON.stringify(r)).replace(/"/g, '&quot;')})">Edit</button>
                                        <button class="btn btn-small btn-danger" onclick="deleteRecord(${i})">Delete</button>
                                    </td>
                                </tr>
                            `).join('')}
                        </tbody>
                    </table>
                `;
                
            } catch (err) {
                showMessage('Error loading records: ' + err.message, 'error');
            }
        }
        
        function showAddForm() {
            currentRecordIndex = null;
            document.getElementById('editJson').value = JSON.stringify({
                id: 'new-record-' + Date.now(),
                status: 'active',
                createdAt: new Date().toISOString()
            }, null, 2);
            document.getElementById('editCard').classList.remove('hidden');
        }
        
        function editRecord(index, json) {
            currentRecordIndex = index;
            document.getElementById('editJson').value = JSON.stringify(JSON.parse(json), null, 2);
            document.getElementById('editCard').classList.remove('hidden');
        }
        
        function hideEdit() {
            document.getElementById('editCard').classList.add('hidden');
        }
        
        async function saveRecord() {
            try {
                const record = JSON.parse(document.getElementById('editJson').value);
                
                let url, method;
                if (currentRecordIndex !== null) {
                    url = `/api/mock-admin/services/${currentServiceName}/records/${currentRecordIndex}`;
                    method = 'PUT';
                } else {
                    url = `/api/mock-admin/services/${currentServiceName}/records`;
                    method = 'POST';
                }
                
                const res = await fetch(url, {
                    method,
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ record })
                });
                
                const data = await res.json();
                
                if (data.success) {
                    showMessage('Record saved successfully', 'success');
                    hideEdit();
                    await loadRecords(currentServiceName);
                    await loadServices();
                } else {
                    showMessage('Error: ' + (data.error?.message || 'Unknown error'), 'error');
                }
                
            } catch (err) {
                showMessage('Invalid JSON: ' + err.message, 'error');
            }
        }
        
        async function deleteRecord(index) {
            if (!confirm('Are you sure you want to delete this record?')) return;
            
            try {
                const res = await fetch(`/api/mock-admin/services/${currentServiceName}/records/${index}`, {
                    method: 'DELETE'
                });
                
                const data = await res.json();
                
                if (data.success) {
                    showMessage('Record deleted', 'success');
                    await loadRecords(currentServiceName);
                    await loadServices();
                } else {
                    showMessage('Error: ' + (data.error?.message || 'Unknown error'), 'error');
                }
                
            } catch (err) {
                showMessage('Error deleting record: ' + err.message, 'error');
            }
        }
        
        async function reloadMocks() {
            try {
                const res = await fetch('/api/mock-admin/reload', { method: 'POST' });
                const data = await res.json();
                showMessage(data.message || 'Mocks reloaded', data.success ? 'success' : 'error');
            } catch (err) {
                showMessage('Error reloading: ' + err.message, 'error');
            }
        }
        
        async function createBackup() {
            try {
                const res = await fetch('/api/mock-admin/backup', { method: 'POST' });
                const data = await res.json();
                showMessage(data.message || 'Backup created', data.success ? 'success' : 'error');
            } catch (err) {
                showMessage('Error creating backup: ' + err.message, 'error');
            }
        }
        
        function showMessage(text, type) {
            const msg = document.getElementById('message');
            msg.textContent = text;
            msg.className = `message ${type}`;
            msg.classList.remove('hidden');
            setTimeout(() => msg.classList.add('hidden'), 5000);
        }
        
        loadServices();
    </script>
</body>
</html>
